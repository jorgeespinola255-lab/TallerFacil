  $("nav").innerHTML=[["home","Resumen","M4 4h6v7H4zM14 4h6v4h-6zM14 12h6v8h-6zM4 15h6v5H4z"],["list","Órdenes","M9 4h6v3H9zM7 5H5v16h14V5h-2M9 12h6M9 16h4"],["clients","Clientes","M16 20v-1a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v1M10 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M20 20v-1a4 4 0 0 0-3-3.9M15 4.2a3.5 3.5 0 0 1 0 6.6"],["balance","Balance","M3 7a2 2 0 0 1 2-2h13v4M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-1M16 14h.01"],["shop","Taller","M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4"]].map(([k,l,ic])=>`<button onclick="go('${k}')" ${(view===k||(k==="list"&&(view==="new"||view==="detail"||view==="receipt"||view==="payrec"))||(k==="clients"&&view==="client")||(k==="home"&&view==="warr")||(k==="shop"&&view==="prices"))?'aria-current="page"':""}>${SV(ic)}<span>${l}</span></button>`).join("");

}
const badge=s=>`<span class="b">${L[s]}</span>`;

function showList(f){flt=f;q="";go("list")}
let dip=null;
if(typeof window!=="undefined"&&window.addEventListener)window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e;if(view==="shop")render()});

if(typeof navigator!=="undefined"&&"serviceWorker" in navigator&&typeof location!=="undefined"&&/^https?:$/.test(location.protocol)&&window.addEventListener)window.addEventListener("load",()=>{try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}});
function toastMsg(h){$("toast").innerHTML=h;setTimeout(()=>{if($("toast").innerHTML===h)$("toast").innerHTML=""},7000)}
function dl(name,blob){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toastMsg(`<b>Descargando ${esc(name)}</b><p class="mu" style="margin:4px 0 0">Buscalo en la carpeta de descargas de tu celular.</p>`)}
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;

    w32(h,0x04034b50);w16(h,20);w16(h,0x0800);w16(h,0);w16(h,0);w16(h,0x21);w32(h,c);w32(h,d.length);w32(h,d.length);w16(h,nb.length);w16(h,0);

const xe=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
const colL=i=>{let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
function sheetXml(rows){const nc=Math.max(1,...rows.map(r=>r.length));
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="${nc}" width="20" customWidth="1"/></cols><sheetData>${rows.map((r,i)=>`<row r="${i+1}">${r.map((v,j)=>{const ref=colL(j)+(i+1);

function xlsx(sheets){const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',N="http://schemas.openxmlformats.org/";
  const f=[["[Content_Types].xml",`${H}<Types xmlns="${N}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],
  ["_rels/.rels",`${H}<Relationships xmlns="${N}package/2006/relationships"><Relationship Id="rId1" Type="${N}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],

  ["xl/styles.xml",`${H}<styleSheet xmlns="${N}spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
  ...sheets.map(([,rows],i)=>[`xl/worksheets/sheet${i+1}.xml`,sheetXml(rows)])];
  return zip(f)}
const mm=n=>({m:r2(n)});
function reportSheets(){
  const O=[["N.\u00ba","Fecha de ingreso","Cliente","Tel\u00e9fono","Marca","Modelo","IMEI / serie","Falla","Estado","Importe","Cobrado","Saldo","Costo cargado","Fecha de entrega"]];
  db.orders.slice().sort((a,b)=>a.n-b.n).forEach(o=>{const c=cust(o.cid);O.push([o.n,dt(o.at),c.name,c.phone,o.brand,o.model,o.imei||"",o.fault,L[o.st],mm(due(o)),mm(paidSum(o)),mm(Math.max(0,bal(o))),mm(costOf(o)),o.delAt?dt(o.delAt):""])});
  const pe=[];db.orders.forEach(o=>o.pays.forEach(p=>pe.push([p.at,[dt(p.at),o.n,cust(o.cid).name,MT[p.m]||p.m,mm(p.a)]])));
  const P=[["Fecha","Orden N.\u00ba","Cliente","Medio","Monto"],...pe.sort((a,b)=>a[0]-b[0]).map(x=>x[1])];
  const M=[["Fecha","Tipo","Concepto","Medio","Monto"],...db.moves.slice().sort((a,b)=>a.at-b.at).map(x=>[dt(x.at),x.k==="in"?"Ingreso":"Gasto",x.d,MT[x.m]||x.m,mm(x.a)])];
  const C=[["Nombre","Tel\u00e9fono","\u00d3rdenes","\u00daltima visita"],...db.customers.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>{const os=db.orders.filter(o=>o.cid===c.id),l=Math.max(0,...os.map(o=>o.at));return[c.name,c.phone,os.length,l?dt(l):""]})];
  const Pr=[["Tipo","Nombre","Costo","Precio de venta"],...db.catalog.slice().sort((a,b)=>a.c.localeCompare(b.c)).map(k=>[k.t,k.c,mm(k.cost||0),mm(k.p)])];

function exportAll(){dl(`tallerfacil-datos-${ymd(Date.now())}.xlsx`,xlsx(reportSheets()))}
function exportBal(){const r=range();if(!r)return;const inR=t=>t>=r[0]&&t<=r[1],ev=[];
  db.orders.forEach(o=>o.pays.forEach(p=>{if(inR(p.at))ev.push({at:p.at,k:"Cobro",a:p.a,m:p.m,d:`Orden #${o.n} \u00b7 ${cust(o.cid).name}`})}));
  db.moves.forEach(x=>{if(inR(x.at))ev.push({at:x.at,k:x.k==="in"?"Ingreso":"Gasto",a:x.a,m:x.m,d:x.d})});

  else{const p=m==="m"?c/(1-x/100):c*(1+x/100);t=`Precio de venta sugerido: ${money(r2(p))} (ganancia ${money(r2(p-c))}).`;$("ip").value=r2(p)}
  $("co").textContent=t}
function del(id){ask(ord(id).pays&&ord(id).pays.length?"Esta orden tiene pagos registrados que dejarán de figurar en el balance. ¿Eliminarla igualmente?":"¿Eliminar esta orden? No se puede deshacer.",()=>{db.orders=db.orders.filter(o=>o.id!==id);save();go("list")},"Eliminar")}

function msg(o){const c=cust(o.cid),s=db.shop;
  return [`*${s.name||"Taller"}* – Orden #${o.n}`,`Equipo: ${o.brand} ${o.model}`.trim(),`Falla: ${o.fault}`,`Estado: ${L[o.st]}`,
  ...o.items.map(i=>`• ${i.c} (${i.q}×) ${money(lt(i))}`),`Total estimado: ${money(total(o))}`,o.est?`Entrega estimada: ${dt(o.est+"T12:00:00")}`:"",s.phone?`Contacto: ${s.phone}`:""].filter(Boolean).join("\n")}
function wa(id,text){const o=ord(id),p=digits(cust(o.cid).phone);
  const to=p.startsWith("54")&&p.length>=12?p:"";
  const body=text||msg(o),url=`https://wa.me/${to}?text=${encodeURIComponent(body)}`;let w=null;try{w=window.open(url,"_blank")}catch(e){}if(!w)waFallback(url,body)}
let lastWa="";
function waFallback(url,body){lastWa=body;$("toast").innerHTML=`<b>WhatsApp no se abrió solo.</b><p class="mu" style="margin:4px 0 10px">Tocá el enlace; si tampoco abre, copiá el mensaje y pegalo en el chat del cliente.</p><div class="acts"><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="${url}" target="_blank" rel="noopener noreferrer">Abrir WhatsApp</a><button class="sec" onclick="copyLast()">Copiar mensaje</button><button class="sec" onclick="$('toast').innerHTML=''">Cerrar</button></div>`}
function copyLast(){const t=lastWa,done=ok=>{$("toast").innerHTML=ok?`<b>Mensaje copiado.</b><p class="mu" style="margin:4px 0 0">Abrí WhatsApp y pegalo en el chat del cliente.</p>`:`<b>No se pudo copiar.</b><p class="mu" style="margin:4px 0 0">Mantené apretado el texto del comprobante para copiarlo, o sacá una captura de pantalla.</p>`;setTimeout(()=>{$("toast").innerHTML=""},6000)};
  const fb=()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}a.remove();done(ok)};
  try{navigator.clipboard.writeText(t).then(()=>done(true),fb)}catch(e){fb()}}
function waStatus(id){const o=ord(id);notify=null;wa(id,tmpl(o));render()}
function tmpl(o){const c=cust(o.cid),n=c.name.split(" ")[0],s=db.shop,dev=`${o.brand} ${o.model}`.trim(),sig=s.name?`\n— ${s.name}`:"",amt=o.final>0?o.final:total(o);
  const t={received:`recibimos tu ${dev} (orden #${o.n}). Te avisamos apenas tengamos novedades.`,
  diagnosing:`estamos diagnosticando tu ${dev} (orden #${o.n}). Te contamos el resultado en breve.`,
  awaiting_approval:`ya tenemos el presupuesto de tu ${dev} (orden #${o.n}): ${money(total(o))}. ¿Querés que avancemos con la reparación?`,
  awaiting_part:`estamos esperando un repuesto para tu ${dev} (orden #${o.n}).${o.est?` Entrega estimada: ${dt(o.est+"T12:00:00")}.`:""}`,
  repairing:`ya estamos reparando tu ${dev} (orden #${o.n}).`,
  ready:`tu ${dev} (orden #${o.n}) está listo para retirar.${amt>0?(paidSum(o)>0?` Saldo a abonar: ${money(Math.max(0,amt-paidSum(o)))}.`:` Importe: ${money(amt)}.`):""}`,
  delivered:`gracias por confiar en nosotros. Entregamos tu ${dev} (orden #${o.n}).${o.delAt&&o.wd?` Garantía hasta el ${dt(o.delAt+o.wd*864e5)}.`:""}`,
  cancelled:`la orden #${o.n} de tu ${dev} quedó cancelada. Ante cualquier duda, escribinos.`}[o.st];
  return `Hola ${n}, ${t}${sig}`}
function receiptHtml(o){const c=cust(o.cid),s=db.shop,e=x=>esc(x)||"—";
  return `<div class="os"><div class="oh">${s.logo?`<img src="${s.logo}" alt="">`:""}<div class="on"><div class="nm">${esc(s.name||"Taller")}</div><div class="ct">${[s.address,s.phone].filter(Boolean).map(esc).join(" · ")}</div></div><div class="onum">ORDEN DE SERVICIO<b>N.º ${o.n}</b>${dt(o.at)}</div></div>
<div class="og"><section><h3>Cliente</h3><p><b>${esc(c.name)}</b><br>${esc(c.phone)}</p></section><section><h3>Equipo recibido</h3><p><b>${esc(`${o.brand} ${o.model}`.trim())}</b>${o.imei?`<br>IMEI/serie: ${esc(o.imei)}`:""}</p></section></div>
<section><h3>Falla reportada</h3><p>${e(o.fault)}</p></section>
<div class="og"><section><h3>Estado físico</h3><p>${e(o.phys)}</p></section><section><h3>Accesorios</h3><p>${e(o.acc)}</p></section></div>
${s.terms?`<section><h3>Términos y condiciones</h3><p class="tc">${esc(s.terms)}</p></section>`:""}
<div class="of"><span>Documento no fiscal. No es una factura.</span>${s.sign===false?"":`<div class="sg">Firma del cliente</div>`}</div></div>`}
function receiptText(o){const c=cust(o.cid),s=db.shop,pd=paidSum(o),eq=`${o.brand} ${o.model}`.trim()+(o.imei?` (IMEI/serie ${o.imei})`:"");
  return [`*${s.name||"Taller"}*${s.phone?" · "+s.phone:""}`,s.address,`Orden de servicio · N.º ${o.n}`,`Fecha: ${dt(o.at)}`,`Cliente: ${c.name}`,`Equipo: ${eq}`,`Falla declarada: ${o.fault}`,`Estado físico: ${o.phys||"—"}`,`Accesorios: ${o.acc||"—"}`,"Términos y condiciones:",s.terms,"Documento no fiscal."].filter(Boolean).join("\n")}
function vReceipt(){const o=ord(sel);if(!o)return vList();
  return `<button class="lnk" onclick="go('detail','${o.id}')">← Volver a la orden</button><h1>Orden de servicio</h1>
<div class="paper">${receiptHtml(o)}</div>
<div class="acts"><button class="btn" onclick="waReceipt('${o.id}')">Enviar por WhatsApp</button><button class="sec" onclick="copyReceipt('${o.id}')">Copiar texto</button><button class="sec" onclick="printSheet('${o.id}')">Imprimir o guardar PDF</button></div>
<p class="mu" id="rm" style="margin-top:10px">Para guardarlo como imagen, sacá una captura de pantalla del comprobante.</p>`}
function waReceipt(id){wa(id,receiptText(ord(id)))}
function copyReceipt(id){const t=receiptText(ord(id));let ok=false;
  const fb=()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{ok=document.execCommand("copy")}catch(e){}a.remove();$("rm").textContent=ok?"Texto copiado.":"No se pudo copiar. Usá la captura de pantalla o el botón de WhatsApp."};
  try{navigator.clipboard.writeText(t).then(()=>{$("rm").textContent="Texto copiado."},fb)}catch(e){fb()}}
function printSheet(id){$("sheet").innerHTML=receiptHtml(ord(id));if($("rm"))$("rm").textContent="Si no se abre la impresión, usá la captura de pantalla o el botón de WhatsApp.";try{window.print()}catch(e){}}

function vClients(){return `<h1>Clientes</h1>${db.customers.length?db.customers.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>{const os=db.orders.filter(o=>o.cid===c.id),last=Math.max(0,...os.map(o=>o.at));
return `<button class="card" onclick="go('client','${c.id}')"><b>${esc(c.name)}</b><div class="mu" style="margin:4px 0 0">${esc(c.phone)} · ${os.length} orden(es) · última visita ${dt(last||null)}</div></button>`}).join(""):`<div class="box"><b>Sin clientes</b><p class="mu" style="margin:6px 0 0">Se crean al registrar una orden.</p></div>`}`}
function vClient(){const c=db.customers.find(c=>c.id===sel);if(!c)return vClients();
return `<button class="lnk" onclick="go('clients')">← Volver</button><h1>${esc(c.name)}</h1><p class="mu">${esc(c.phone)}</p><details class="box" ${errs.cust?"open":""}><summary style="cursor:pointer;font-weight:600;min-height:28px">Editar cliente</summary><div style="margin-top:12px"><div class="g"><label>Nombre y apellido<input id="cn2" value="${esc(c.name)}"></label><label>Teléfono<input id="cp2" inputmode="tel" value="${esc(c.phone)}"></label></div>${errs.cust?`<div class="err">${errs.cust}</div>`:""}<button class="btn" onclick="saveCust('${c.id}')">Guardar cliente</button></div></details><h2>Historial de reparaciones</h2>${db.orders.filter(o=>o.cid===c.id).sort((a,b)=>b.at-a.at).map(orderCard).join("")||`<p class="mu">Sin órdenes.</p>`}`}

function exportDb(){db.lastBackup=Date.now();save();const t=JSON.stringify({app:"fixflow",v:1,at:Date.now(),data:db}),a=$("bk");a.value=t;a.focus();a.select();
 $("bkm").textContent="Listo: el texto de arriba es tu copia. Pegálo ahora en tus notas, en un chat con vos mismo o en un correo.";
 try{navigator.clipboard.writeText(t).then(()=>{$("bkm").textContent="Listo: el texto de arriba es tu copia y ya se copió al portapapeles. Pegálo ahora en tus notas, en un chat con vos mismo o en un correo."},()=>{})}catch(e){}}
function importDb(){let p;try{p=JSON.parse($("bk").value)}catch(e){$("bkm").textContent="El texto no es una copia válida.";return}
 const d=p&&(p.app==="fixflow"||p.app==="tallerfacil")?p.data:null;
 if(!d||!Array.isArray(d.customers)||!Array.isArray(d.orders)||!d.orders.every(o=>o&&Array.isArray(o.items)&&Array.isArray(o.h))){$("bkm").textContent="El texto no es una copia válida de TallerFácil.";return}
 ask(`Se reemplazarán los datos actuales por la copia (${d.orders.length} órdenes, ${d.customers.length} clientes). ¿Continuar?`,()=>{
 db=Object.assign(db,d);db.moves=Array.isArray(d.moves)?d.moves:[];db.catalog=Array.isArray(d.catalog)?d.catalog:[];db.seq=Math.max(db.seq||1000,...d.orders.map(o=>+o.n||0));save();go("home")},"Reemplazar")}
function vShop(){const s=db.shop,f=(k,l,t="text")=>`<label>${l}<input type="${t}" value="${esc(s[k])}" onchange="db.shop.${k}=${t==="number"?"Math.max(0,+this.value||0)":"this.value"};save()"></label>`;
return `<h1>Taller</h1><div class="box">${f("name","Nombre comercial")}${f("phone","Teléfono")}${f("address","Dirección")}${f("warranty","Garantía predeterminada (días)","number")}
<label>Términos y condiciones (se imprimen en la orden de servicio)<textarea rows="9" style="min-height:160px" onchange="db.shop.terms=this.value;save()">${esc(s.terms)}</textarea></label><div class="acts" style="margin:0 0 10px"><button class="sec" onclick="sampleTerms()">Usar texto de ejemplo</button></div><label style="display:flex;align-items:center;gap:10px"><input type="checkbox" style="width:22px;min-height:22px;margin:0" ${s.sign!==false?"checked":""} onchange="db.shop.sign=this.checked;save()">Incluir línea de firma del cliente</label>
<p class="mu">Todo lo que cargues acá (nombre, teléfono, dirección, logo y términos) se usa en la orden de servicio. El texto de ejemplo es editable: adaptalo a tu negocio y revisalo según la normativa aplicable. La orden de servicio no es una factura fiscal.</p></div>
<div class="box"><h2>Logo del taller</h2>${s.logo?`<div style="background:#fff;border:1px solid var(--ln);border-radius:8px;padding:8px;display:inline-block;margin:0 0 10px"><img src="${s.logo}" alt="Logo del taller" style="max-width:160px;max-height:90px;display:block"></div>`:`<p class="mu">Todavía no cargaste un logo. Va a aparecer en el comprobante y en la orden.</p>`}
<label>Elegir imagen (PNG o JPG)<input id="lg" type="file" accept="image/*" onchange="setLogo(this.files[0])"></label>${lerr?`<div class="err">${lerr}</div>`:""}
${s.logo?`<button class="dng" onclick="rmLogo()">Quitar logo</button>`:""}</div>
<div class="box"><h2>Lista de precios</h2><p class="mu">${db.catalog.length} ítem${db.catalog.length===1?"":"s"}. Repuestos y servicios con su precio, para armar presupuestos más rápido.</p><button class="btn" onclick="go('prices')">Abrir lista de precios</button></div>
<div class="box"><h2>Instalar en el celular</h2><p class="mu">Abrila como una app, desde un ícono en tu pantalla y también sin internet (después de abrirla una vez con conexión). En el menú del navegador (⋮) elegí “Instalar aplicación” o “Agregar a pantalla de inicio”.</p>${dip?`<button class="btn" onclick="instApp()">Instalar ahora</button>`:""}</div>
<div class="box"><h2>Reportes en Excel</h2><p class="mu">Un archivo .xlsx con órdenes, pagos, ingresos y gastos, clientes y lista de precios. Para el balance de un período, usá el botón de la pestaña Balance.</p><button class="btn" onclick="exportAll()">Descargar Excel con todos los datos</button></div>
<div class="box"><h2>Copia de seguridad</h2><p class="mu">Guardá una copia para no perder tus datos si se borra el navegador o cambiás de celular. Descargala como archivo y guardala en un lugar seguro (por ejemplo, mandándotela por WhatsApp o correo). Para recuperar tus datos, usá “Restaurar desde archivo”.</p><div class="acts"><button class="btn" onclick="dlBackup()">Descargar copia</button><button class="sec" onclick="exportDb()">Ver como texto</button><button class="sec" onclick="importDb()">Importar texto</button></div><label style="margin-top:10px">Restaurar desde archivo<input type="file" accept=".json,.txt,application/json" onchange="readBk(this.files[0])"></label><label style="margin-top:10px">Copia (texto)<textarea id="bk" rows="5" placeholder="Al exportar aparece acá. Para importar, pegá una copia y tocá Importar."></textarea></label><p class="mu" id="bkm">${db.lastBackup?`Última copia generada: ${dt(db.lastBackup)}.`:"Todavía no generaste ninguna copia."}</p></div>`}
render();
</script>
</body>
</html>
